<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DCS Studio preview — DCS Setup</title>
<!-- Load order is load-bearing: harness -> fixture -> CSS -> mounts -> real
     media/setup.js. Unlike the other panels setup.js posts nothing at load: it
     renders an empty form immediately and waits for the host's {type:"init"}
     push. The fixture therefore sends init on DOMContentLoaded — which fires
     after this body's scripts have run, so setup.js's message listener is
     already attached. -->
<script src="harness.js"></script>
<script src="fixtures/setup.js"></script>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="../media/base.css" />
<link rel="stylesheet" href="../media/setup.css" />
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="../media/shared.js"></script>
<script src="../media/setup.js"></script>
</body>
</html>
