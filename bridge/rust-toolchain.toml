# Pin the toolchain, because this workspace already depends on a recent one
# without saying so anywhere.
#
# `Duration::from_mins` (used in the tests) and `&raw mut` (used in
# `lua_panic::error_object`) both need a 2024-era compiler, and the workspace
# lint policy denies warnings — so a clippy version drift is a red build too,
# and CI has already been bitten once by a lint that fired on stable but not
# locally (7fb7d93). An unpinned toolchain makes "it builds" a property of
# whoever built it.
#
# Raise this deliberately when the code needs something newer, rather than
# discovering the requirement from a failed build on somebody else's machine.
[toolchain]
channel = "1.97.0"
# llvm-tools-preview is here because CI's coverage gate needs it and a
# directory override wins over whatever the CI action installed: asking
# dtolnay/rust-toolchain for `stable` + llvm-tools-preview installs the
# component against *stable*, then this file selects 1.97.0 for every cargo
# invocation under bridge/ — a toolchain without it. That was green only for
# as long as stable happened to be 1.97.0. The workflow now names 1.97.0
# explicitly and the component is listed here, so the pin, the cache key and
# the installed toolchain all agree.
components = ["rustfmt", "clippy", "llvm-tools-preview"]
