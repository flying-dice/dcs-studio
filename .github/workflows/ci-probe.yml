name: CI probe (temporary)

on:
  push:
    branches: [ci-probe]

jobs:
  probe-windows:
    # Mirrors the real "Shipping target (Windows)" test steps to verify the
    # activation-test fix on windows-latest before it reaches develop.
    name: Probe unit + integration (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript compile
        run: npm run compile
      - name: Unit + integration on the shipping OS
        run: npm run test:unit && npm run test:integration
