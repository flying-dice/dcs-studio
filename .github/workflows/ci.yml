name: CI

on:
  push:
    branches: [main, develop]
    # A tag push matches no branch filter, so without this the full pyramid
    # never runs for a release — and release.yml runs neither lint, nor e2e,
    # nor clippy. The DLLs it ships load inside a running flight sim, where the
    # panic-restriction lints are the whole defence.
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# One job per layer of the testing pyramid, so a failure names the layer that
# broke rather than "tests failed", and so the layers run concurrently instead
# of serially behind one another. Each vitest layer gates its own coverage at
# 100% against its own disjoint include set (see vitest.*.config.ts); the e2e
# layer does the same for media/*.js via scripts/e2e-coverage.mjs.
#
# The three TypeScript layers run on Linux: the domain layer resolves paths
# with explicit Windows semantics regardless of host, so they are deterministic
# off-Windows. The `windows` job keeps the shipping target honest — it compiles
# and builds the bridge DLLs on the OS the extension actually runs on.

jobs:
  static:
    name: Compile + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # TODO: clean-code - 0.58 - BOUNDARY: `tsc -p ./` typechecks src/ only —
      # tsconfig.json's `include` is ["src"], and it is the repo's only
      # compilation unit. All of test/, tests/, the shared vscode double and the
      # config files are transpiled by esbuild without ever being typechecked,
      # so the double and the ports it stands in for can drift apart silently
      # while this step reads as a repo-wide gate. Add a tsconfig.test.json
      # (extends the base, noEmit, includes test/ tests/ *.config.ts) and run it
      # here too.
      - name: TypeScript compile
        run: npm run compile
      - name: Biome lint + format check (JS/TS)
        run: npm run lint

  unit:
    name: Unit layer (100% gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests + coverage gate
        run: npm run coverage:unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage/unit

  integration:
    name: Integration layer (100% gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integration tests + coverage gate
        run: npm run coverage:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-integration
          path: coverage/integration

  e2e:
    name: E2E layer (100% gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Webview e2e + coverage gate
        run: npm run coverage:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-e2e
          path: coverage/e2e

  rust:
    name: Rust bridge tests (100% gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
      # bridge-core/build.rs links PUC liblua5.1 on non-Windows so the unit
      # tests — which create real Lua states — run as ordinary executables
      # here. Same 5.1 ABI DCS ships; DCS's own lua.dll is not redistributable.
      - name: Install Lua 5.1 (test-time link target)
        run: sudo apt-get update && sudo apt-get install -y liblua5.1-0-dev
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Regions is llvm-cov's branch-equivalent metric, and it is the one that
      # matters most here: a `?` early return or an unexercised match arm can sit
      # at 100% line coverage, and an unexercised error path in this workspace
      # panics the user's flight sim. The three TypeScript layers all gate
      # branches at 100; this is the same promise.
      - name: Rust tests + coverage gate
        run: >-
          cargo llvm-cov --workspace
          --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100
        working-directory: bridge

  windows:
    name: Shipping target (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript compile
        run: npm run compile
      # The layers already gated on Linux; re-run the two headless ones here to
      # prove the Windows path semantics the domain layer assumes are the real
      # ones, not just the ones path.win32 emulates.
      - name: Unit + integration on the shipping OS
        run: npm run test:unit && npm run test:integration

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
      - name: Rust format check
        run: cargo fmt --check
        working-directory: bridge
      # -D warnings promotes the workspace lint policy (clippy pedantic +
      # panic-path restriction lints, see bridge/Cargo.toml) into a hard gate.
      - name: Rust clippy (pedantic workspace policy)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: bridge
      - name: Rust workspace builds (both bridge DLLs)
        run: cargo build --release --workspace
        working-directory: bridge
      - name: Upload bridge DLLs artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-dlls
          path: |
            bridge/target/release/dcs_studio_gui.dll
            bridge/target/release/dcs_studio_mission.dll
            bridge/hook/DcsStudio.lua
