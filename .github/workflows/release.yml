name: Release extension

# Ship flow (GitHub is the source of truth): bump "version" in package.json,
# tag the commit vX.Y.Z, push the tag. This packages the .vsix (with freshly
# built bridge DLLs staged into bridge/prebuilt/) and attaches it to a GitHub
# Release for that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The full pyramid — lint, typecheck, all four coverage gates, clippy under
  # -D warnings, and the Windows build — as a gate rather than a bystander.
  #
  # Both workflows used to trigger on `push: tags`, which made CI *run* for a
  # release without making it *matter*: two workflows started by the same tag
  # are independent, with no `needs`, no `workflow_run` and no required status
  # between them, so this job would happily attach the .vsix and both DLLs to a
  # release while CI was still going red beside it. Calling it is what turns it
  # into a precondition.
  ci:
    name: Full pipeline
    uses: ./.github/workflows/ci.yml

  # Everything these check is knowable from the checkout alone, so they run
  # beside the pipeline rather than behind it: a mismatched version fails in
  # seconds instead of after the whole pyramid, and neither waits on the other.
  guards:
    name: Release guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The bridge guard below diffs this tag against the previous one.
          fetch-depth: 0

      - name: Guard - tag matches package.json version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($pkg -ne $tag) { throw "package.json version ($pkg) != tag ($tag)" }

      # package.json's version says nothing about the bridge: bridge/Cargo.toml
      # carries its own [workspace.package] version, and that is what both DLLs
      # and both openrpc.json goldens embed. The release step attaches the DLLs
      # separately precisely so a bridge-only deploy can take them, so two
      # releases handing out dcs_studio_gui.dll reporting the same bridge
      # version with different JSON-RPC surfaces is a reachable outcome.
      - name: Guard - bridge version bumped when bridge/crates changed
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          # git writes progress and "no names found" to stderr; under pwsh 7.3+
          # a non-zero native exit would otherwise abort the step before the
          # explicit $LASTEXITCODE checks below can decide what it means.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          function Get-BridgeVersion([string]$Toml) {
            # Only [workspace.package]'s version — every crate's [package] has a
            # version key too, and they inherit rather than set it.
            $section = [regex]::Match($Toml, '(?ms)^\[workspace\.package\][^\[]*')
            if (-not $section.Success) { throw "bridge/Cargo.toml has no [workspace.package] section" }
            $found = [regex]::Match($section.Value, '(?m)^\s*version\s*=\s*"([^"]+)"')
            if (-not $found.Success) { throw "bridge/Cargo.toml [workspace.package] has no version" }
            return $found.Groups[1].Value
          }

          $prev = git describe --tags --abbrev=0 HEAD^
          if ($LASTEXITCODE -ne 0 -or -not $prev) {
            Write-Host "No earlier tag to compare against - skipping."
            exit 0
          }

          $changed = git diff --name-only $prev HEAD -- bridge/crates
          if ($LASTEXITCODE -ne 0) { throw "could not diff bridge/crates against $prev" }
          if (-not $changed) {
            Write-Host "bridge/crates unchanged since $prev - bridge version may stay put."
            exit 0
          }

          $priorToml = (git show "${prev}:bridge/Cargo.toml" | Out-String)
          if ($LASTEXITCODE -ne 0) {
            Write-Host "$prev predates bridge/Cargo.toml - nothing to compare."
            exit 0
          }

          $was = Get-BridgeVersion $priorToml
          $now = Get-BridgeVersion (Get-Content bridge/Cargo.toml -Raw)
          if ($was -eq $now) {
            throw "bridge/crates changed since $prev but bridge/Cargo.toml [workspace.package] version is still $now. The DLLs and both openrpc.json goldens embed it, and this release attaches the DLLs on their own - bump it."
          }
          Write-Host "bridge version $was -> $now"
          exit 0

  release:
    name: Package & publish GitHub release
    runs-on: windows-latest
    # Nothing is packaged, let alone published, until both have passed.
    needs: [ci, guards]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Everything the pyramid covers — lint, typecheck, four coverage gates,
      # clippy, the Windows build — has already passed in `ci` above, so what
      # is left here is only what produces the artefacts. `vscode:prepublish`
      # compiles again during packaging; this step exists so a compile failure
      # is named as one rather than surfacing from inside vsce.
      - name: TypeScript compile
        run: npm run compile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge

      - name: Build bridge DLLs (release)
        run: cargo build --release --workspace
        working-directory: bridge

      - name: Stage prebuilt payload (DLLs + scaffold lua.lib)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bridge/prebuilt | Out-Null
          Copy-Item bridge/target/release/dcs_studio_gui.dll bridge/prebuilt/
          Copy-Item bridge/target/release/dcs_studio_mission.dll bridge/prebuilt/
          Copy-Item bridge/lua5.1/lua.lib bridge/prebuilt/

      # `npm run package` runs the vsce pinned in devDependencies and installed
      # by `npm ci` above — not whatever the registry serves at release time.
      # A vsce major changes packaging defaults with no change on this side, and
      # the failure surfaces to users as a broken .vsix. `vscode:prepublish`
      # fires here and asserts the payload staged above is actually present.
      - name: Package .vsix
        run: npm run package

      - name: Create GitHub release with .vsix + bridge DLLs
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # The DLLs also ship inside the vsix; attaching them (and the hook)
        # separately lets a bridge-only deploy grab them without the extension.
        # The two .openrpc.json goldens ride along so each bridge's JSON-RPC
        # schema ships versioned next to the DLL that serves it.
        # If a release for this tag already exists (e.g. a draft was pre-created
        # for testing and then published, which is what created the tag), refresh
        # its assets instead of failing on the duplicate.
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            (Get-Item *.vsix).FullName,
            "bridge/prebuilt/dcs_studio_gui.dll",
            "bridge/prebuilt/dcs_studio_mission.dll",
            "bridge/hook/DcsStudio.lua",
            "bridge/crates/bridge-gui/openrpc/dcs_studio_gui.openrpc.json",
            "bridge/crates/bridge-mission/openrpc/dcs_studio_mission.openrpc.json"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "DCS Studio $tag" --generate-notes
          }

      # Marketplace publishing is deliberately manual: download the .vsix from
      # the GitHub Release and drag it into
      # https://marketplace.visualstudio.com/manage/publishers/flying-dice
      # for the releases worth publishing.
      - name: Upload .vsix artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dcs-studio-vsix
          path: "*.vsix"
