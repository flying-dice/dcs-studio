name: Release extension

# Ship flow (GitHub is the source of truth): bump "version" in package.json,
# tag the commit vX.Y.Z, push the tag. This packages the .vsix (with freshly
# built bridge DLLs staged into bridge/prebuilt/) and attaches it to a GitHub
# Release for that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package & publish GitHub release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile
        run: npm run compile

      # The two gates by name, not `vitest run --coverage`: the root
      # vitest.config.ts is a `projects` config, and vitest treats `coverage` as
      # a root-only option, so the per-project thresholds are ignored there. That
      # form computes coverage and gates nothing.
      - name: Unit + integration coverage gates
        run: npm run coverage:unit && npm run coverage:integration

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge

      - name: Build bridge DLLs (release)
        run: cargo build --release --workspace
        working-directory: bridge

      - name: Stage prebuilt payload (DLLs + scaffold lua.lib)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bridge/prebuilt | Out-Null
          Copy-Item bridge/target/release/dcs_studio_gui.dll bridge/prebuilt/
          Copy-Item bridge/target/release/dcs_studio_mission.dll bridge/prebuilt/
          Copy-Item bridge/lua5.1/lua.lib bridge/prebuilt/

      # TODO: clean-code - 0.52 - DRY (#60): this guards package.json's version, but
      # the bridge workspace carries its own independent version (currently
      # 0.3.0) and that is what the DLLs and both openrpc.json goldens embed.
      # Nothing gates that it was bumped when bridge/crates/** changed, so two
      # releases can hand out dcs_studio_gui.dll reporting the same bridge
      # version with different JSON-RPC surfaces — and the step below attaches
      # the DLLs separately precisely so a bridge-only deploy can take them.
      - name: Guard - tag matches package.json version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($pkg -ne $tag) { throw "package.json version ($pkg) != tag ($tag)" }

      # TODO: clean-code - 0.6 - BOUNDARY (#59): @vscode/vsce is neither a
      # devDependency nor pinned here, so the tool that builds the artefact a
      # user installs is resolved from the registry at release time. A vsce
      # major changes packaging defaults with no change on this side, and the
      # failure surfaces to users as a broken .vsix.
      #
      # TODO: clean-code - 0.55 - BOUNDARY (#59): `vscode:prepublish` is just
      # `npm run compile`. Nothing asserts bridge/prebuilt/ holds the two DLLs
      # and lua.lib — that staging exists only in the steps above, and the
      # directory is gitignored. `npx vsce package` run by hand therefore
      # produces a .vsix that installs and activates cleanly and then fails at
      # the point of use. A two-line existence check that exits non-zero makes
      # a mis-staged package fail loudly instead of shipping.
      - name: Package .vsix
        run: npx @vscode/vsce package

      - name: Create GitHub release with .vsix + bridge DLLs
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # The DLLs also ship inside the vsix; attaching them (and the hook)
        # separately lets a bridge-only deploy grab them without the extension.
        # The two .openrpc.json goldens ride along so each bridge's JSON-RPC
        # schema ships versioned next to the DLL that serves it.
        # If a release for this tag already exists (e.g. a draft was pre-created
        # for testing and then published, which is what created the tag), refresh
        # its assets instead of failing on the duplicate.
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            (Get-Item *.vsix).FullName,
            "bridge/prebuilt/dcs_studio_gui.dll",
            "bridge/prebuilt/dcs_studio_mission.dll",
            "bridge/hook/DcsStudio.lua",
            "bridge/crates/bridge-gui/openrpc/dcs_studio_gui.openrpc.json",
            "bridge/crates/bridge-mission/openrpc/dcs_studio_mission.openrpc.json"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "DCS Studio $tag" --generate-notes
          }

      # Marketplace publishing is deliberately manual: download the .vsix from
      # the GitHub Release and drag it into
      # https://marketplace.visualstudio.com/manage/publishers/flying-dice
      # for the releases worth publishing.
      - name: Upload .vsix artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dcs-studio-vsix
          path: "*.vsix"
